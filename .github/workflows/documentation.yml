name: Documentation checks

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - 'tools/tests/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - 'tools/tests/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documentation checker
        run: python3 -B -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Check guide entry points and links
        run: python3 -B tools/check_docs.py
