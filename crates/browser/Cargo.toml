[package]
name = "rustos-browser"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
javascript = ["dep:rustos-script"]

[dependencies]
rustos-web-image = { path = "../web-image" }
rustos-text = { path = "../text" }
rustos-script = { path = "../script", optional = true }
