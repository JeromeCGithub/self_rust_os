[package]
name = "jworker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
[dependencies]
userlib = { path = "../userlib", default-features = true }
rustos-quickjs = { path = "../../crates/quickjs" }
rustos-browser-worker = { path = "../../crates/browser-worker" }
[[bin]]
name = "jworker"
path = "../userlib/src/application.rs"
