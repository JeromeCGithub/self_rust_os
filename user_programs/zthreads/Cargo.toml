[package]
name = "zthreads"
version = "0.1.0"
edition = "2021"
description = "Native Ring 3 threading demonstration and regression probe"
license = "MIT OR Apache-2.0"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
[dependencies]
rustos-thread-abi = { path = "../../crates/thread-abi" }
userlib = { path = "../userlib", features = ["threads"] }
[[bin]]
name = "zthreads"
path = "../userlib/src/application.rs"
