[package]
name = "glow"
version = "0.1.0"
edition = "2021"
description = "Trusted steady-progress service fixture"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[dependencies]
userlib = { path = "../userlib" }

[[bin]]
name = "glow"
path = "../userlib/src/application.rs"
