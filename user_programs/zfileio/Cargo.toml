[package]
name = "zfileio"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ring 3 file descriptor and working-directory regression probe"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
[dependencies]
userlib = { path = "../userlib", features = ["threads"] }
[[bin]]
name = "zfileio"
path = "../userlib/src/application.rs"
