[package]
name = "userlib"
version = "0.1.0"
edition = "2021"
description = "Minimal user-space standard library for self_rust_os."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
