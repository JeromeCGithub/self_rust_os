[package]
name = "zinit"
version = "0.1.0"
edition = "2021"
description = "Private Ring 3 init failure and ABI regression probe"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true

[dependencies]
rustos-thread-abi = { path = "../../crates/thread-abi" }
initator = { path = "../initator" }
rustos-service-core = { path = "../../crates/service-core" }
userlib = { path = "../userlib" }

[[bin]]
name = "zinit"
path = "../userlib/src/application.rs"
