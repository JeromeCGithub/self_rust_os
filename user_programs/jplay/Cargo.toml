[package]
name = "jplay"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "z"
lto = true
[dependencies]
userlib = {path="../userlib"}
rustos-media = {path="../../crates/media"}
[[bin]]
name = "jplay"
path = "../userlib/src/application.rs"
